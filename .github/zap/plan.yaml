env:
  contexts:
    - name: app
      urls:
        - ${APPLICATION_URL}
      includePaths:
        - ${APPLICATION_URL}.*
      excludePaths:
        - ".*[Ll]ogout.*"
        - ".*[Dd]elete.*"
      authentication:
        method: browser
        parameters:
          loginPageUrl: ${APPLICATION_URL}
          loginPageWait: 5
          browserId: firefox-headless
        verification:
          method: response
          loggedInRegex: "\\QLogout\\E"   # replace with text only shown when logged in
      sessionManagement:
        method: cookie
      users:
        - name: scan-account
          credentials:
            username: ${ZAP_USER}
            password: ${ZAP_PASS}

jobs:
  - type: spider
    parameters:
      context: app
      user: scan-account
      maxDuration: 10

  - type: spiderAjax
    parameters:
      context: app
      user: scan-account
      maxDuration: 10
      browserId: firefox-headless

  - type: passiveScan-wait

  - type: report
    parameters:
      template: traditional-html
      reportDir: /zap/wrk
      reportFile: report.html